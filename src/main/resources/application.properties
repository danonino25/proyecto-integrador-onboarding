spring.application.name=onboarding

# Configuración de base de datos H2 en memoria (con auto-creación de esquema)
spring.datasource.url=jdbc:h2:mem:onboardingdb;INIT=CREATE SCHEMA IF NOT EXISTS ONBOARDING;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate ddl-auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true